# docker compose up --build, then open http://localhost:5173.
# KITCHEN_TOKEN comes from your shell or a .env file next to this one (see .env.example). Without
# it the restaurant routes stay closed (401).
services:
  service:
    build: .
    command: ["npm", "run", "service"]
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      KITCHEN_TOKEN: ${KITCHEN_TOKEN:-}
      KITCHEN_AUTO_ADVANCE_SECONDS: ${KITCHEN_AUTO_ADVANCE_SECONDS:-0}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: .
    command:
      ["npm", "run", "dev", "-w", "@pizza/web", "--", "--host", "0.0.0.0"]
    environment:
      SERVICE_URL: http://service:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
