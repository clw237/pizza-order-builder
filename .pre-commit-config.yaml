# Fast checks before each commit. Install once per clone (needs Python):
#   uvx pre-commit install      (or: pipx run pre-commit install)
# Run on everything:  uvx pre-commit run --all-files
# Slower checks (types, tests) run with `bash scripts/check.sh` and in CI. Bootstrap may add the
# project's formatter and linter here as `local` hooks so they use the project's own versions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json$ # tsconfig files allow comments
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
