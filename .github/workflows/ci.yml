name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Add the setup step for your stack (the bootstrap skill does this).
      # Pin each action to a full commit SHA with the version in a comment.
      # Python:     astral-sh/setup-uv            then: uv sync
      # Node/TS:    actions/setup-node            then: npm ci
      # Go:         actions/setup-go
      # Rust:       preinstalled on ubuntu-latest (rustup)
      # Java:       actions/setup-java
      # .NET:       actions/setup-dotnet

      - name: Guardrail script tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Check
        # Skipped until bootstrap adds a project, so the bare template stays green.
        if: hashFiles('pyproject.toml', 'package.json', 'go.mod', 'Cargo.toml', 'gradlew', '**/*.sln', '**/*.csproj') != ''
        run: bash scripts/check.sh

  changelog:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Code changes have a changelog line
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_changelog.py --base "$BASE_REF" --head "$HEAD_SHA"
