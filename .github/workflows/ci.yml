name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Guardrail script tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Check
        # Skipped until bootstrap adds a project, so the bare template stays green.
        if: hashFiles('pyproject.toml', 'package.json', 'go.mod', 'Cargo.toml', 'gradlew', '**/*.sln', '**/*.csproj') != ''
        run: bash scripts/check.sh

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: npm run e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  compose:
    # Builds the image, starts the stack the README documents and runs the smoke script against it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KITCHEN_TOKEN: ci-only-placeholder
      # The smoke script moves the order itself, so the timer must not move it first.
      KITCHEN_AUTO_ADVANCE_SECONDS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke test
        run: bash scripts/compose-smoke.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down

  changelog:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Code changes have a changelog line
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_changelog.py --base "$BASE_REF" --head "$HEAD_SHA"
