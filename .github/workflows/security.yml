name: Security

# A secret scan and a scan of the files Claude follows. Kept out of the required checks so a new
# finding doesn't block unrelated work; it runs weekly too. Bootstrap adds a dependency audit for
# the project's language (pip-audit, npm audit, cargo audit, govulncheck...).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the pull request's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Scans the commits in the push or pull request for API keys, tokens and passwords.
      # Free for personal accounts; repositories owned by an organization need a GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  agent-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CLAUDE.md and .claude/ are instructions Claude follows: check them for hidden characters,
      # HTML comments, encoded payloads, download-and-run lines and unexpected hooks (decision 0003).
      - run: python3 scripts/scan_agent_files.py
